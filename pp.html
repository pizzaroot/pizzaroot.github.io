<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>osu!mania PP Farmer</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,400;0,600;0,700;1,400&display=swap');
        body { font-family: 'Exo 2', sans-serif; }
        .osu-bg { background-color: #1e1e24; } /* 짙은 배경 */
        .osu-card { background-color: #2a2a32; } /* 카드 배경 */
        .osu-pink { color: #ff66aa; } /* osu! 핑크 */
        .osu-btn { background-color: #ff66aa; transition: 0.2s; }
        .osu-btn:hover { background-color: #ff4d99; transform: translateY(-2px); }
    </style>
</head>
<body class="osu-bg text-white min-h-screen flex flex-col items-center py-10">

    <div id="app" class="w-full max-w-4xl px-4">
        
        <header class="text-center mb-10">
            <h1 class="text-5xl font-bold mb-2">osu!<span class="osu-pink">mania</span> Recommender</h1>
            <p class="text-gray-400">당신의 기록을 분석하여 PP 파밍 맵을 찾아드립니다.</p>
        </header>

		<div class="flex justify-center mb-12">
			<div class="relative w-full max-w-lg flex">
				<input 
					v-model="username" 
					@keyup.enter="getRecommendations"
					type="text" 
					placeholder="유저 닉네임을 입력하세요 (예: GOA)" 
					class="flex-1 w-full p-4 rounded-l-lg bg-gray-800 border-2 border-gray-700 focus:border-pink-500 focus:outline-none text-lg placeholder-gray-500"
				>
				<button 
					@click="getRecommendations" 
					:disabled="loading"
					class="osu-btn px-8 rounded-r-lg font-bold text-lg text-white disabled:opacity-50 disabled:cursor-not-allowed shrink-0 whitespace-nowrap">
					<span v-if="loading">분석 중...</span>
					<span v-else>검색</span>
				</button>
			</div>
		</div>
        <div v-if="error" class="bg-red-500/20 border border-red-500 text-red-200 px-4 py-3 rounded mb-6 text-center">
            {{ error }}
        </div>

		<div v-if="recommendations.length > 0" class="space-y-4">
			<h2 class="text-2xl font-bold mb-4 border-b border-gray-700 pb-2">
				추천 결과 <span class="text-pink-400 text-sm ml-2">({{ recommendations.length }}개 발견)</span>
			</h2>

			<div v-for="(map, index) in recommendations" :key="map.map_id" 
					class="osu-card p-4 rounded-lg flex items-center justify-between hover:bg-gray-700 transition shadow-lg border-l-4 border-pink-500">
				
				<div class="flex-1 min-w-0 pr-4">
					<a :href="map.link" target="_blank" class="text-lg font-semibold hover:text-pink-400 truncate block transition">
						{{ map.full_title }}
					</a>
					<div class="text-sm text-gray-400 mt-1">
						Map ID: {{ map.map_id }}
					</div>
				</div>

				<div class="flex space-x-6 text-right shrink-0">
					<div class="flex flex-col items-end">
						<span class="text-xs text-gray-400">예상 PP</span>
						<span class="text-xl font-bold text-pink-400">{{ map.predicted_pp.toFixed(0) }}pp</span>
					</div>
					<div class="flex flex-col items-end">
						<span class="text-xs text-gray-400">예상 정확도</span>
						<span class="text-xl font-bold" 
								:class="getAccColor(map.predicted_acc)">
							{{ map.predicted_acc.toFixed(2) }}%
						</span>
					</div>
				</div>
			</div>
		</div>

        <div v-else-if="searched && !loading && !error" class="text-center text-gray-500 mt-10">
            추천할 맵을 찾지 못했습니다.
        </div>

    </div>

    <script>
        const { createApp } = Vue

        createApp({
            data() {
                return {
                    username: '',
                    recommendations: [],
                    loading: false,
                    error: null,
                    searched: false
                }
            },
            methods: {
                async getRecommendations() {
                    if (!this.username) return;

                    this.loading = true;
                    this.error = null;
                    this.recommendations = [];
                    this.searched = false;

                    try {
                        // 로컬 서버 주소 (FastAPI 포트 확인 필요, 기본 8000)
                        const response = await axios.get(`https://14d4dd88213e.ngrok-free.app/recommend/${this.username}`);
                        this.recommendations = response.data;
                    } catch (err) {
                        console.error(err);
                        if (err.response && err.response.status === 404) {
                            this.error = "유저를 찾을 수 없습니다. 닉네임을 확인해주세요.";
                        } else {
                            this.error = "서버 오류가 발생했습니다. 백엔드가 켜져있는지 확인하세요.";
                        }
                    } finally {
                        this.loading = false;
                        this.searched = true;
                    }
                },
                getAccColor(acc) {
                    if (acc >= 99) return 'text-yellow-400'; // SS/S 급
                    if (acc >= 97) return 'text-green-400';  // Good
                    if (acc >= 95) return 'text-blue-400';   // Okay
                    return 'text-gray-400';
                }
            }
        }).mount('#app')
    </script>
</body>
</html>
